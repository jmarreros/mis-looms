[package]
name = "mis-looms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
chrono = "0.4.45"
dirs = "7.0.0"
enumflags2 = "0.7.12"
futures-util = "0.3.34"
gstreamer = "0.25.4"
ksni = "0.3.6"
notify-rust = "4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
