[package]
name = "mis-looms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
async-channel = "2.5.0"
bytes = "1.12.1"
chrono = "0.4.45"
dirs = "7.0.0"
enumflags2 = "0.7.12"
futures-util = "0.3.34"
gstreamer = "0.25.4"
gstreamer-app = "0.25"
gstreamer-pbutils = "0.25"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
ksni = "0.3.6"
notify-rust = "4.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
